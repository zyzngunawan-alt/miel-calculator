workflows:
  miel-android-debug:
    name: Miel Calculator Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install project dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Generate Android project
        script: npx cap add android
      - name: Set Android SDK path
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Sync Capacitor assets
        script: npx cap sync android
      - name: Build installable debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
